run: uvicorn app.main:app --host 0.0.0.0 --port 8000
seed: python scripts/seed.py
test: python -m unittest discover -s tests -v
base_url: http://localhost:8000
endpoints:
  - GET /health
  - POST /tenants
  - GET /plans
  - POST /usage/record
  - GET /usage/{tenant_id}
  - POST /generate
  - POST /billing/checkout
  - POST /webhooks/stripe
